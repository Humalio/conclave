<div class="login" id="login" hidden>
  <form id="lf" autocomplete="on">
    <div class="logo" role="img" aria-label="Conclave" title="Conclave"><svg aria-hidden="true"><use href="#i-logo"/></svg></div>
    <input class="inp" id="lu" name="username" autocomplete="username" aria-label="User" placeholder="User" required>
    <input class="inp" id="lp" name="password" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
    <input class="inp mono" id="lt" name="totp" inputmode="numeric" autocomplete="one-time-code" aria-label="Code" placeholder="000000" maxlength="6" hidden>
    <div class="err" id="le" role="alert"></div>
    <button class="btn pri lg" type="submit">Sign in</button>
  </form>
</div>

<aside class="side" aria-label="Navigation">
  <div class="logo" role="img" aria-label="Conclave" title="Conclave"><svg aria-hidden="true"><use href="#i-logo"/></svg></div>
  <button class="nav on" data-go="agents" data-tip="Work  G" aria-label="Work"><svg class="i"><use href="#i-home"/></svg><i class="bdg" data-work-badge hidden></i></button>
  <button class="nav" data-go="security" data-tip="Security  K" aria-label="Security"><svg class="i"><use href="#i-shield"/></svg><i class="bdg" data-request-badge hidden></i></button>
  <button class="nav" data-go="vault" data-tip="Vault  V" aria-label="Vault"><svg class="i"><use href="#i-vault"/></svg></button>
  <button class="nav" data-go="log" data-tip="Auditing  L" aria-label="Auditing"><svg class="i"><use href="#i-log"/></svg></button>
  <div class="sp"></div>
  <button class="nav" data-go="shortcuts" data-tip="Shortcuts  ?" aria-label="Shortcuts"><svg class="i"><use href="#i-kbd"/></svg></button>
  <button class="nav" data-go="theme" data-tip="Theme  T" aria-label="Theme"><svg class="i th-ic"><use href="#i-sun"/></svg></button>
  <button class="nav me-btn" data-me aria-label="Account" aria-haspopup="menu" aria-expanded="false"><span class="av lg" data-av>A</span></button>
</aside>
<div class="menu" id="meMenu" role="menu" aria-label="Account" hidden></div>

<main class="main" id="app" hidden>
  <section class="demobar" id="demoBar" aria-label="Demo hub" hidden></section>
  <header class="appbar" id="appbar">
    <h1 id="pageTitle">Work</h1>
    <span class="grow"></span>
    <button class="ibtn show-m" id="appAct" data-go="tbuild" aria-label="New team" hidden><svg class="i"><use href="#i-plus"/></svg></button>
    <span class="clock"><span class="dot pulse" id="liveDot"></span><span id="clock">--:--:--</span></span>
    <button class="btn bad lk hide-m" id="lk" data-go="lock" aria-label="Lockdown"><svg class="i"><use href="#i-lock"/></svg>Lockdown</button>
    <button class="btn join hide-m" id="joinBtn" aria-label="Add" title="Add: a new PC or a team"><svg class="i"><use href="#i-plus"/></svg>Add</button>
    <button class="btn warn enrol hide-m" id="enrol2fa" data-go="account" hidden title="Your admin login has no second factor. Set up 2FA in Account."><svg class="i"><use href="#i-warn"/></svg>No 2FA</button>
    <button class="ibtn show-m" id="moreBtn" aria-label="More" aria-haspopup="dialog"><svg class="i"><use href="#i-more"/></svg><i class="amb" id="moreDot" hidden></i></button>
  </header>

  <header class="appbar detail" id="dbar" aria-label="Screen"></header>
  <div class="lkb" id="lkb" hidden></div>
  <section class="workspace-bar" id="agentsBar" aria-labelledby="agentsTitle" hidden>
    <h2 id="agentsTitle"><svg class="i"><use href="#i-home"/></svg>Work</h2>
    <nav class="seg ws-tabs only-d" aria-label="Work views">
      <button data-go="home"><svg class="i"><use href="#i-home"/></svg>Home</button>
      <button data-go="topology"><svg class="i"><use href="#i-graph"/></svg>Topology</button>
      <button data-go="sessions"><svg class="i"><use href="#i-user"/></svg>Sessions</button>
      <button data-go="chats"><svg class="i"><use href="#i-chat"/></svg>Chats</button>
      <button data-go="feedback"><svg class="i"><use href="#i-wish"/></svg>Feedback<i class="bdg" data-feedback-badge hidden></i></button>
      <button data-go="directives"><svg class="i"><use href="#i-sl"/></svg>Directives<i class="bdg" data-dir-badge hidden></i></button>
    </nav>
    <nav class="tabs only-m" role="tablist" aria-label="Work views">
      <button type="button" role="tab" data-go="home">Home</button>
      <button type="button" role="tab" data-go="topology">Topology</button>
      <button type="button" role="tab" data-go="sessions">Sessions</button>
      <button type="button" role="tab" data-go="chats">Chats</button>
      <button type="button" role="tab" data-go="feedback">Feedback<i class="bdg" data-feedback-badge hidden></i></button>
      <button type="button" role="tab" data-go="directives">Directives<i class="bdg" data-dir-badge hidden></i></button>
    </nav>
  </section>
  <section class="workspace-bar" id="securityBar" aria-labelledby="securityTitle" hidden>
    <h2 id="securityTitle"><svg class="i"><use href="#i-shield"/></svg>Security</h2>
    <div class="ws-row only-d">
    <nav class="seg ws-tabs only-d" aria-label="Security views">
      <button data-go="keys"><svg class="i"><use href="#i-key"/></svg>Keys</button>
      <button data-go="pcs"><svg class="i"><use href="#i-pc"/></svg>PCs</button>
      <button data-go="hardware"><svg class="i"><use href="#i-bolt"/></svg>Hardware</button>
      <button data-go="users"><svg class="i"><use href="#i-user"/></svg>Users</button>
      <button data-go="req"><svg class="i"><use href="#i-clock"/></svg>Requests<i class="bdg" data-request-badge hidden></i></button>
      <button data-go="shares"><svg class="i"><use href="#i-link"/></svg>Shares</button>
      <button data-go="relays"><svg class="i"><use href="#i-pc"/></svg>Relays</button>
      <button data-go="db"><svg class="i"><use href="#i-file"/></svg>Database</button>
    </nav>
    <button type="button" class="btn sm ws-grant" data-sec-new aria-haspopup="true"><svg class="i"><use href="#i-plus"/></svg>New<svg class="i"><use href="#i-cdown"/></svg></button>
    </div>
    <nav class="tabs only-m" role="tablist" aria-label="Security views">
      <button type="button" role="tab" data-go="keys">Keys</button>
      <button type="button" role="tab" data-go="pcs">PCs</button>
      <button type="button" role="tab" data-go="hardware">Hardware</button>
      <button type="button" role="tab" data-go="users">Users</button>
      <button type="button" role="tab" data-go="req">Requests<i class="bdg" data-request-badge hidden></i></button>
      <button type="button" role="tab" data-go="shares">Shares</button>
      <button type="button" role="tab" data-go="db">Database</button>
      <button type="button" role="tab" data-go="grant">Agent access</button>
    </nav>
  </section>
  <section class="workspace-bar" id="vaultBar" aria-labelledby="vaultTitle" hidden>
    <h2 id="vaultTitle"><svg class="i"><use href="#i-vault"/></svg>Vault</h2>
    <nav class="seg ws-tabs only-d" aria-label="Vault views">
      <button data-vault-tab="contents"><svg class="i"><use href="#i-file"/></svg>Contents</button>
      <button data-vault-tab="access"><svg class="i"><use href="#i-key"/></svg>Access</button>
      <button data-vault-tab="act"><svg class="i"><use href="#i-pulse"/></svg>Activity</button>
      <button data-vault-tab="conf"><svg class="i"><use href="#i-warn"/></svg>Conflicts</button>
      <button data-go="knowledge"><svg class="i"><use href="#i-graph"/></svg>Knowledge</button>
      <button data-go="vreaders"><svg class="i"><use href="#i-pc"/></svg>Readers</button>
    </nav>
    <nav class="tabs only-m" role="tablist" aria-label="Vault views">
      <button type="button" role="tab" data-vault-tab="contents">Contents</button>
      <button type="button" role="tab" data-vault-tab="access">Access</button>
      <button type="button" role="tab" data-vault-tab="act">Activity</button>
      <button type="button" role="tab" data-vault-tab="conf">Conflicts</button>
      <button type="button" role="tab" data-go="knowledge">Knowledge</button>
      <button type="button" role="tab" data-go="vreaders">Readers</button>
    </nav>
  </section>
  <section class="workspace-bar" id="auditBar" aria-labelledby="auditTitle" hidden>
    <h2 id="auditTitle"><svg class="i"><use href="#i-log"/></svg>Auditing</h2>
    <nav class="seg ws-tabs only-d" aria-label="Auditing views">
      <button data-go="log" data-arg="audit"><svg class="i"><use href="#i-log"/></svg>Audit</button>
      <button data-go="log" data-arg="calls"><svg class="i"><use href="#i-bolt"/></svg>Calls</button>
      <button data-go="log" data-arg="files"><svg class="i"><use href="#i-file"/></svg>Files</button>
      <button data-go="log" data-arg="alerts"><svg class="i"><use href="#i-warn"/></svg>Alerts</button>
      <button data-go="log" data-arg="telemetry"><svg class="i"><use href="#i-pulse"/></svg>Telemetry</button>
    </nav>
    <nav class="tabs only-m" role="tablist" aria-label="Audit views">
      <button type="button" role="tab" data-go="log" data-arg="audit">Audit</button>
      <button type="button" role="tab" data-go="log" data-arg="calls">Calls</button>
      <button type="button" role="tab" data-go="log" data-arg="files">Files</button>
      <button type="button" role="tab" data-go="log" data-arg="alerts">Alerts<span class="cnt" data-alert-count></span></button>
      <button type="button" role="tab" data-go="log" data-arg="telemetry">Telemetry</button>
    </nav>
  </section>
  <section class="workspace-bar ctx-bar" id="ctxBar" aria-labelledby="ctxTitle" hidden></section>
  <div id="overview" data-mode="home">
  <div id="ovAlert" hidden></div>
  <section class="card stats kpistrip" id="kpis" aria-label="Key figures"></section>
  <!-- Home's cards (docs/proposals/console-systems.md §5.2 B): DOM order is screen, phone and Tab order, and matches HOME_CARDS in app.js;
       placement from 1180 px is one grid-template-areas block in style.css. -->
  <section class="grid home-grid">
    <article class="card w-tl tl" id="homeTeams" aria-labelledby="tmH">
      <div class="hd"><h2 id="tmH">Teams</h2><span class="meta" id="tmN"></span><div class="grow"></div><button type="button" class="btn sm" data-go="projects" aria-label="Projects"><svg class="i"><use href="#i-proj"/></svg><span class="hd-lbl">Projects</span></button><button type="button" class="btn sm" data-go="tbuild" aria-label="New team"><svg class="i"><use href="#i-plus"/></svg><span class="hd-lbl">Team</span></button><button type="button" class="btn sm ic" id="homeTlMore" aria-label="More team actions" aria-haspopup="dialog"><svg class="i"><use href="#i-more"/></svg></button></div>
      <div id="homeOb"></div>
      <div id="homeTl"></div>
    </article>
    <article class="card bl-card w-bl" id="blCard" aria-labelledby="blH">
      <div class="hd"><h2 id="blH">Backlog</h2><span class="meta" id="blN"></span><div class="grow"></div><button class="btn sm" data-go="backlog">All backlog</button></div>
      <div id="blL"></div>
    </article>
    <article class="card w-motion" id="wmCard" aria-labelledby="wmH">
      <div class="hd"><h2 id="wmH">Work in motion</h2><div class="grow"></div><button type="button" class="pill-btn" id="wmNew" hidden></button><button type="button" class="btn sm ic" id="wmPause" aria-pressed="false" aria-label="Pause the list"><svg class="i"><use href="#i-pause"/></svg></button></div>
      <div id="wm" aria-live="off"></div>
      <div class="wm-foot" id="wmFoot"></div>
